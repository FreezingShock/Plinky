name: Set up Godot
description: Restore or download the Godot binary, restore the .godot import cache, and import the project.

inputs:
  version:
    description: Godot release tag
    default: "4.7-stable"

runs:
  using: composite
  steps:
    - name: Cache Godot binary
      id: godot-cache
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-${{ inputs.version }}-linux-x86_64

    - name: Install Godot
      if: steps.godot-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/godot
        curl -fsSL --retry 3 -o /tmp/godot.zip \
          "https://github.com/godotengine/godot-builds/releases/download/${{ inputs.version }}/Godot_v${{ inputs.version }}_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot
        mv ~/godot/Godot_v${{ inputs.version }}_linux.x86_64 ~/godot/godot
        chmod +x ~/godot/godot

    # Import results depend on the source assets and project settings. An exact hit skips the import work;
    # a restore-key hit still makes it incremental. Only Godot's own cache folder is stored.
    - name: Cache import data
      uses: actions/cache@v4
      with:
        path: .godot/imported
        key: godot-import-${{ inputs.version }}-${{ hashFiles('project.godot', 'assets/**', 'fonts/**', 'theme/**', '**/*.import') }}
        restore-keys: godot-import-${{ inputs.version }}-

    - name: Import project
      shell: bash
      run: ~/godot/godot --headless --path . --import
