name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A new push to a PR cancels that PR's superseded run. Runs on main are never cancelled, so every merge is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: "4.7-stable"

jobs:
  # Docs-, changelog- and markdown-only PRs cannot change game behaviour: skip the engine jobs for them.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!changelog.d/**'
              - '!**/*.md'

  # The three engine jobs run in parallel; each pays only its own import and Godot start-up.
  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Version script tests
        run: python3 tests/test_bump_version.py

      - name: Unit tests (tests/run.gd)
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script tests/run.gd 2>&1 | tee /tmp/tests.log
          # A script that fails to parse can still exit 0, so also fail on engine script errors.
          ! grep -E "SCRIPT ERROR|Parse Error" /tmp/tests.log

      # Autoloads don't exist under --script, so main.gd can't be compiled by the unit tests. Boot the real
      # project for a couple of seconds and fail on script errors. Gating: it catches runtime script errors the unit tests miss.
      - name: Boot smoke test (loads main.gd)
        run: |
          set -o pipefail
          timeout 90 ~/godot/godot --headless --path . --quit-after 180 -- --skip-title 2>&1 | tee /tmp/boot.log || true
          ! grep -E "SCRIPT ERROR|Parse Error" /tmp/boot.log

  sim:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Balance sim (tools/sim.gd)
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script tools/sim.gd 2>&1 | tee /tmp/sim.log
          ! grep -E "SCRIPT ERROR|Parse Error|NOT reached" /tmp/sim.log

  play:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      # Plays the real main scene through the meadow, Larkmoor, every sky state and pad presses, and fails on any
      # script or shader error (a per-frame error in a layer shows up as a "fast" frame time, not a crash).
      - name: Play smoke (tools/bench.gd)
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script tools/bench.gd -- --frames=20 --quality=low 2>&1 | tee /tmp/bench.log
          ! grep -E "SCRIPT ERROR|Parse Error" /tmp/bench.log

      # Frame budget: no frame over 150 ms in the headless bench (300 ms for a zone swap under the wipe) (script-side stalls such as a synchronous load or a
      # whole zone built in one frame; the Larkmoor swap was one 330 ms frame). GPU cost needs the real-window bench.
      - name: Frame budget (shots/bench.json)
        run: python3 tools/check_frame_budget.py shots/bench.json 150 300 250 1300

  # PRs never edit the version files (the Release workflow stamps them) and game changes carry a changelog fragment.
  # Escape hatch: the `no-changelog` label. Docs/CI/test-only PRs need no fragment.
  changelog-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    steps:
      - name: Check changelog rules
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" --jq '.[].filename')
          echo "$files"
          bad=$(echo "$files" | grep -xE 'CHANGELOG.md|core/build_info.gd|export_presets.cfg' || true)
          if [ -n "$bad" ]; then
            echo "::error::Do not edit these in a PR (the Release workflow stamps the version): $bad. Add changelog.d/<slug>.patch.md instead (docs/versioning.md)."
            exit 1
          fi
          case ",$LABELS," in *,no-changelog,*) exit 0;; esac
          if echo "$files" | grep -qE '^(core|data|world|render|ui|boot|audio|theme|fonts|content|assets)/|^project.godot$'; then
            if ! echo "$files" | grep -qE '^changelog\.d/.+\.(patch|minor)\.md$'; then
              echo "::error::Game files changed but there is no changelog fragment. Add changelog.d/<slug>.patch.md (or .minor.md), see docs/versioning.md, or label the PR no-changelog."
              exit 1
            fi
          fi

  # One stable check name for the whole pipeline ("test"). Skipped engine jobs (docs-only PRs) count as passing.
  test:
    needs: [changes, unit, sim, play, changelog-guard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}'
          ! echo '${{ join(needs.*.result, ' ') }}' | grep -E "failure|cancelled"
