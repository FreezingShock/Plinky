name: Update PR branches with main

# Keeps auto-merge PRs current with main. A PR that falls behind main has to rerun CI after a human merges main by hand,
# and a stale PR that conflicts stays stuck without anyone noticing. On each push to main this merges main into every
# open, non-draft PR that has auto-merge on. It uses a GitHub App token, because a push made with GITHUB_TOKEN does not
# start CI. A PR that conflicts is skipped and listed in the run summary; its owner merges main by hand.
#
# Needs repo secrets APP_ID and APP_PRIVATE_KEY from a GitHub App installed on this repo with Contents: read and write,
# Pull requests: read and write, and Workflows: read and write (a PR that changes .github/workflows needs the last one).
# Until the secrets exist, the job logs a notice and does nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time. Two main pushes close together queue behind each other instead of racing on the same PR branches.
concurrency:
  group: update-prs-with-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_APP: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - name: Skip until the App secrets exist
        if: env.HAS_APP != 'true'
        run: echo "::notice::APP_ID and APP_PRIVATE_KEY are not set. Nothing to update."

      - name: Create App token
        if: env.HAS_APP == 'true'
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Merge main into open auto-merge PRs
        if: env.HAS_APP == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const rows = [];
            for (const pr of prs) {
              if (pr.draft || !pr.auto_merge) continue;
              try {
                await github.rest.pulls.updateBranch({
                  owner, repo, pull_number: pr.number, expected_head_sha: pr.head.sha,
                });
                rows.push([`#${pr.number}`, 'main merged in, CI restarts on the new head']);
              } catch (err) {
                // 422 means the branch is already current or cannot merge cleanly. Either way it is not this job's to fix.
                rows.push([`#${pr.number}`, `skipped (${err.status}): ${err.message}`]);
              }
            }
            const summary = core.summary.addHeading('Update PR branches with main');
            if (rows.length === 0) {
              summary.addRaw('No open PR with auto-merge on.', true);
            } else {
              summary.addTable([
                [{ data: 'PR', header: true }, { data: 'Result', header: true }],
                ...rows,
              ]);
            }
            await summary.write();
